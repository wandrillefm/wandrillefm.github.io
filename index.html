
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wandrille.fm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
    --bg-color: #f3f4f6;

    --beige: #e6dccf;          /* warm beige */
    --charcoal: #111111;       /* charcoal black */

    --text-main: var(--charcoal);
    --text-muted: #6b7280;
}


        body {
    font-family: 'Inter', sans-serif;
    background-color: var(--charcoal);
    margin: 0;
    overflow: hidden;
    color: var(--beige);
    user-select: none;
}


        /* Hide Scrollbars but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Background Grain */
        .grain-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.15;
            z-index: 100;
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
            mix-blend-mode: overlay;
        }

        /* Layout */
        #main-slider {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
        }

        .project-column {
            flex: 0 0 100vw;
            height: 100vh;
            scroll-snap-align: center;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
        }

        .section-view {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            position: relative;
        }

        .perspective-element {
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.1s linear, opacity 0.1s linear;
            will-change: transform, filter, opacity;
        }

        .image-container {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1/1;
            background: var(--charcoal);
            border-radius: 2px;
            overflow: hidden;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-cover: cover;
            pointer-events: none;
        }

        .nav-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #d1d5db;
            transition: all 0.3s ease;
        }
        .nav-dot.active {
            background: var(--beige);
            transform: scale(1.5);
        }

        /* Interaction States */
        .is-dragging {
            cursor: grabbing !important;
            scroll-snap-type: none !important;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>

    <div class="grain-overlay"></div>

    <!-- UI Elements -->
    <header class="fixed top-0 left-0 w-full p-8 flex justify-between items-end z-50 pointer-events-none">
        <div>
            <h1 class="text-2xl font-black uppercase leading-tight">Wandrille fm</h1>
            <span class="text-[10px] font-bold tracking-[0.5em] text-gray-400 uppercase">Portfolio 2026</span>
        </div>
        <div id="project-counter" class="hidden md:block text-[10px] font-bold tracking-[0.2em] uppercase">
            Project 1 / 5
        </div>
    </header>
<footer class="fixed bottom-8 right-8 z-50 flex gap-4" id="dots-container"></footer>

    <div class="fixed bottom-0 left-0 w-full h-1 bg-gray-200 z-50">
<div id="progress-bar" class="h-full transition-all duration-500 w-0" style="background: var(--beige)"></div>

    </div>

    <!-- Main Content -->
    <main id="main-slider" class="no-scrollbar">
        <!-- Projects injected by JS -->
    </main>

    <script>
        const PROJECTS = [
            { id: 1, name: 'wandrille fernex de mongex', desc: 'web designer', imgs: ['vianneyphotos.png'] },
            
            { id: 1, name: 'photos de la chapelle', desc: 'Portfolio - photographe de mariage', imgs: ['https://picsum.photos/seed/aura1/1000/1000', 'https://picsum.photos/seed/aura2/1000/1000'] },

            { id: 2, name: 'sjmv', desc: 'communication - posts', imgs: ['https://picsum.photos/seed/mirage1/1000/1000', 'https://picsum.photos/seed/mirage2/1000/1000'] },

            { id: 3, name: 'prudence bijoux', desc: 'boutique - rebranding', imgs: ['https://picsum.photos/seed/echo1/1000/1000', 'https://picsum.photos/seed/echo2/1000/1000', 'https://picsum.photos/seed/echo3/1000/1000'] },

            { id: 4, name: 'vianney photos', desc: 'photographe animalier', imgs: ['vianneyphotos.png', 'https://picsum.photos/seed/zenith2/1000/1000'] },

            { id: 5, name: 'et vous?', desc: 'contactez-moi' wandrille.fm@gmail.com', imgs: [] },

        ];

        const mainSlider = document.getElementById('main-slider');
        const dotsContainer = document.getElementById('dots-container');
        const progressBar = document.getElementById('progress-bar');
        const counter = document.getElementById('project-counter');

        let lastActiveIdx = 0;

        // Render Projects
        PROJECTS.forEach((p, i) => {
            const col = document.createElement('div');
            col.className = 'project-column no-scrollbar';
            col.dataset.index = i;

            // Title Section
            let sectionsHTML = `
                <section class="section-view">
                    <div class="perspective-element text-center px-6 cursor-pointer" onclick="scrollToFirstImage(this)">
                        <h2 class="text-6xl md:text-[120px] font-black tracking-tighter uppercase leading-none">${p.name}</h2>
                        <p class="mt-8 text-sm md:text-base text-gray-500 font-medium tracking-[0.4em] uppercase opacity-60">${p.desc}</p>
                    </div>
                    <div class="absolute bottom-28 animate-bounce opacity-30 text-[10px] font-bold uppercase tracking-widest">< déplacez vous ou descendez ></div>
                </section>
            `;

            // Image Sections
            p.imgs.forEach(img => {
                sectionsHTML += `
                    <section class="section-view px-8">
                        <div class="perspective-element image-container">
                            <img src="${img}" alt="Project image">
                        </div>
                    </section>
                `;
            });

            // Footer Spacer
            sectionsHTML += `<div class="h-[20vh] w-full"></div>`;
            
            col.innerHTML = sectionsHTML;
            mainSlider.appendChild(col);

            // Create Dot
            const dot = document.createElement('div');
            dot.className = `nav-dot ${i === 0 ? 'active' : ''}`;
            dot.onclick = () => mainSlider.scrollTo({ left: i * window.innerWidth, behavior: 'smooth' });
            dotsContainer.appendChild(dot);
        });

        function updatePerspective() {
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;
    const elements = document.querySelectorAll('.perspective-element');

    elements.forEach(el => {
        const rect = el.getBoundingClientRect();
        const elX = rect.left + rect.width / 2;
        const elY = rect.top + rect.height / 2;

        const dx = Math.abs(centerX - elX) / centerX;
        const dy = Math.abs(centerY - elY) / centerY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const normDist = Math.min(dist, 1.5);

        const blur = normDist * 25;
        const opacity = Math.max(1 - Math.pow(normDist, 1.2), 0);
        const scale = 1 - normDist * 0.15;

        el.style.filter = `blur(${blur}px)`;
        el.style.opacity = opacity;
        el.style.transform = `scale(${scale})`;
    });

    // Active project index
    const activeIdx = Math.round(mainSlider.scrollLeft / window.innerWidth);

    if (activeIdx !== lastActiveIdx) {
        document.querySelectorAll('.project-column').forEach((col, i) => {
            if (i !== activeIdx) {
                col.scrollTop = 0;
            }
        });
        lastActiveIdx = activeIdx;
    }

    // UI updates
    const dots = document.querySelectorAll('.nav-dot');
    dots.forEach((d, i) => d.classList.toggle('active', i === activeIdx));

    progressBar.style.width = `${((activeIdx + 1) / PROJECTS.length) * 100}%`;
    counter.innerText = `Project ${activeIdx + 1} / ${PROJECTS.length}`;
}

        // Click to scroll
        window.scrollToFirstImage = (el) => {
            const col = el.closest('.project-column');
            const target = col.querySelectorAll('section')[1];
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        };

        // Unified Drag-to-Scroll (Horizontal)
        let isDraggingX = false;
        let startX, scrollL;

        mainSlider.addEventListener('mousedown', (e) => {
            isDraggingX = true;
            mainSlider.classList.add('is-dragging');
            startX = e.pageX - mainSlider.offsetLeft;
            scrollL = mainSlider.scrollLeft;
        });

        window.addEventListener('mouseup', () => {
            isDraggingX = false;
            mainSlider.classList.remove('is-dragging');
        });

        mainSlider.addEventListener('mousemove', (e) => {
            if (!isDraggingX) return;
            e.preventDefault();
            const x = e.pageX - mainSlider.offsetLeft;
            const walk = (x - startX) * 0.8;
            mainSlider.scrollLeft = scrollL - walk;
        });

        // Individual Vertical Drags
        document.querySelectorAll('.project-column').forEach(col => {
            let isDraggingY = false;
            let startY, scrollT;

            col.addEventListener('mousedown', (e) => {
                isDraggingY = true;
                col.classList.add('is-dragging');
                startY = e.pageY - col.offsetTop;
                scrollT = col.scrollTop;
            });

            window.addEventListener('mouseup', () => {
                isDraggingY = false;
                col.classList.remove('is-dragging');
            });

            col.addEventListener('mousemove', (e) => {
                if (!isDraggingY) return;
                e.preventDefault();
                const y = e.pageY - col.offsetTop;
                const walk = (y - startY) * 0.8;
                col.scrollTop = scrollT - walk;
            });
        });

        // Event Listeners for Style Updates
        mainSlider.addEventListener('scroll', () => requestAnimationFrame(updatePerspective));
        document.querySelectorAll('.project-column').forEach(c => c.addEventListener('scroll', () => requestAnimationFrame(updatePerspective)));
        window.addEventListener('resize', updatePerspective);
        
        // Initial run
        updatePerspective();
    </script>
<div class="fixed bottom-8 left-8 z-50 md:hidden text-[10px] font-bold uppercase tracking-[0.3em] opacity-70">
    <a href="https://instagram.com/wandrille.fm" target="_blank">insta</a>
</div>

</body>
</html>
