<!doctype html>

<head>
  <meta charset="utf-8" />
  <title>Wandrille.fm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #050505;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 10vh 10vw; /* 10% tout autour de l'écran */
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 0.5rem; /* espace entre les cases, ajuste comme tu veux */
    }

    .cell {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: #111; /* fallback si pas d'image */
      cursor: pointer;
    }

    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%);
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    .cell:hover img {
      transform: scale(1.05);
      filter: grayscale(30%);
    }

    .cell::after {
      content: attr(data-title);
      position: absolute;
      left: 0.7rem;
      bottom: 0.6rem;
      right: 0.7rem;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f5f5f5;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      opacity: 0.9;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      body {
        padding: 8vh 5vw;
      }
      .grid {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat( (25 / 3), minmax(80px, 1fr) );
      }
    }
  </style>
</head>
